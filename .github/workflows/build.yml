name: Build

# Compiles the app on a real macOS runner in the cloud, so we can catch
# build errors without needing Xcode installed locally. Runs on every
# push and on pull requests.

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Select latest available Xcode
        run: |
          LATEST=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          echo "Using $LATEST"
          sudo xcode-select -s "$LATEST"
          xcodebuild -version

      - name: Build (Debug, simulator, no code signing)
        run: |
          xcodebuild build \
            -project Questry.xcodeproj \
            -scheme Questry \
            -destination "generic/platform=iOS Simulator" \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO
